<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#F6F2EA" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="6 Week Recomp" />
<title>Katy Recomp MASTER v37 • 6 Week Recomp</title>
<style>
:root{
  --bg:#F6F2EA; --card:#FFFFFF; --card2:#F0ECE3; --muted:#667275; --text:#163536;
  --accent:#2E9F98; --accent2:#6FC5BE; --border:#DED8CE; --good:#4FAE78; --warn:#F2B35D; --danger:#D96C74;
  --shadow:0 10px 28px rgba(34,55,55,.08);
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#FBF8F1 0%,var(--bg) 42%,#EEF4F1 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}
.app{max-width:860px;margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top) 14px calc(92px + env(safe-area-inset-bottom))}
.header{display:flex;justify-content:space-between;align-items:center;padding:18px 4px 10px}
.brand{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3,p{margin:0}
h1{font-size:29px;line-height:1.05}
h2{font-size:20px}
h3{font-size:15px}
.sub{color:var(--muted);font-size:13px;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:linear-gradient(180deg,#FFFFFF,#FCFBF8);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.card.full{grid-column:1/-1}
.kicker{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.big{font-size:30px;font-weight:800}
.metric{display:flex;justify-content:space-between;gap:12px;align-items:end}
.progress{height:8px;background:#E8E3DA;border-radius:999px;overflow:hidden;margin-top:10px}
.progress > span{display:block;height:100%;background:var(--accent);border-radius:999px}
.ring{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;position:relative;grid-area:1/1;background:conic-gradient(var(--accent) var(--pct),#E8E3DA 0)}
.ring:before{content:"";width:96px;height:96px;border-radius:50%;background:var(--card);position:absolute;inset:18px}
.ringwrap{position:relative;width:132px;height:132px;display:grid;place-items:center}
.ringtext{position:relative;text-align:center;grid-area:1/1;z-index:2;display:grid;place-items:center;line-height:1.05}
.ringtext strong{display:block;font-size:26px;margin:0}
.section{margin-top:18px}
.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px}
.tab{white-space:nowrap;border:1px solid var(--border);background:#FFFDF9;color:var(--text);border-radius:999px;padding:10px 14px}
.tab.active{background:var(--accent);color:#061617;border-color:transparent;font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:8px}
.btn{border:none;border-radius:14px;padding:12px 14px;background:var(--accent);color:#07191a;font-weight:800}
.btn.secondary{background:#EFEAE1;color:var(--text);border:1px solid var(--border)}
.btn.ghost{background:#F7FBFA;color:#227A75;border:1px solid #B8DCD8}
.btn.danger{background:#FFF1F2;color:#A6404A;border:1px solid #E7B9BE}
.small{font-size:12px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;background:#202e30;color:#aaf0f4;border:1px solid #275458;padding:5px 8px;border-radius:999px;font-size:11px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:12px;color:var(--muted);display:block}
input,select,textarea{width:100%;margin-top:6px;background:#FFFEFB;color:var(--text);border:1px solid var(--border);border-radius:12px;padding:11px}
textarea{min-height:110px;resize:vertical}
.exercise{margin-top:12px}
.exercise-head{display:flex;gap:12px;align-items:flex-start}
.demo{width:108px;min-width:108px;height:auto;min-height:108px;border-radius:14px;background:#F2EFE8;object-fit:cover;border:1px solid var(--border)}
.demo.fallback{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:11px;text-align:center;padding:10px 8px;box-sizing:border-box;overflow:hidden;line-height:1.2}
.set-table{display:grid;grid-template-columns:46px 1fr 1fr 50px;gap:7px;margin-top:12px;align-items:center}
.set-table input{margin:0;padding:9px 8px}
.check{width:22px;height:22px}
.timerbar{position:sticky;top:8px;z-index:5;background:#E7F6F3;border:1px solid #B3DDD7;padding:10px 12px;border-radius:14px;margin:8px 0 12px;display:none}
.timerbar.show{display:flex;align-items:center;justify-content:space-between;gap:10px}
.timerbig{font-size:24px;font-weight:800}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(250,247,240,.95);backdrop-filter:blur(15px);border-top:1px solid var(--border);padding:9px 8px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:10}
.navin{width:min(860px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.nav button{background:transparent;border:none;color:var(--muted);padding:9px 4px;border-radius:12px;font-size:11px}
.nav button.active{color:#1D7A74;background:#E2F3F0}
.page{display:none}.page.active{display:block}
.daycard{cursor:pointer}
.goalpill{font-size:12px;color:var(--muted)}
.milestone{padding:10px 0;border-bottom:1px solid #2b2b2b}
.milestone:last-child{border-bottom:0}
.chart{display:flex;align-items:end;gap:8px;height:150px;margin-top:10px}
.bar{flex:1;height:100%;background:#E9E4DA;border-radius:8px 8px 3px 3px;position:relative;min-width:24px}
.bar > span{position:absolute;left:0;right:0;bottom:0;background:var(--accent);border-radius:8px 8px 3px 3px}
.bar label{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:10px}
.toast{position:fixed;left:50%;bottom:98px;transform:translateX(-50%);background:#eafcfd;color:#0a2527;padding:10px 14px;border-radius:12px;font-weight:700;display:none;z-index:99}
.toast.show{display:block}
hr{border:none;border-top:1px solid var(--border);margin:14px 0}

.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0 16px}
.weekday{border:1px solid var(--border);background:#FFFDF9;border-radius:14px;padding:9px 3px;text-align:center;font-size:11px;color:var(--muted);cursor:pointer;transition:transform .12s ease,background .12s ease,border-color .12s ease;user-select:none;-webkit-tap-highlight-color:transparent}
.weekday strong{display:block;color:var(--text);font-size:14px;margin-top:2px}
.weekday.today{border-color:#79C9C2;background:#EAF7F5}.weekday:active{transform:scale(.96);background:#E6F4F1}
.weekday.done{box-shadow:inset 0 -3px 0 var(--good)}
.component-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.component{border:1px solid var(--border);background:#FFFDF9;border-radius:15px;padding:12px}
.component.done{border-color:#9ED7B7;background:#F1FBF5}
.component label{display:flex;align-items:center;justify-content:space-between;color:var(--text);font-weight:700;gap:8px}
.component .small{margin-top:5px}
.week-goals{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-top:10px}
.goalchip{white-space:nowrap;border-radius:999px;padding:8px 11px;background:#F2EEE6;border:1px solid var(--border);font-size:12px}
.goalchip strong{color:#1D7A74}
.soft-highlight{background:linear-gradient(135deg,#FFF7E8,#F0FAF7)!important;border-color:#E9D5AA!important}


.coach{margin-top:14px;border-top:1px solid var(--border);padding-top:12px}
.coach-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:#EEF7F4;color:var(--text);padding:12px 14px;border-radius:12px;font-weight:800;font-size:14px}
.coach-body{display:none;padding:12px 4px 2px}
.coach-body.open{display:block}
.coach-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.coach-box{background:#FAF8F3;border:1px solid var(--border);border-radius:12px;padding:10px}
.coach-box b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#287C76;margin-bottom:5px}
.coach-box p{margin:0;font-size:13px;line-height:1.42;color:var(--text)}
.coach-cue{margin-top:9px;background:#FFF5DF;border:1px solid #E9D4A7;border-radius:12px;padding:11px;font-size:13px}
@media(max-width:520px){.coach-grid{grid-template-columns:1fr}}


.move-btn{border:1px solid var(--border);background:#F6F2EA;color:#2E736E;border-radius:999px;padding:6px 10px;font-weight:700;font-size:11px}
.drag-handle{font-size:16px;color:#7D8A87;cursor:grab;padding:2px 5px}
.daycard.dragover{outline:2px dashed #57AAA3;outline-offset:3px;background:#F0FAF7}
.move-sheet{position:fixed;inset:0;display:none;z-index:50;background:rgba(10,30,30,.25);align-items:flex-end}
.move-sheet.open{display:flex}
.move-sheet-panel{width:100%;background:#FFFDF9;border-radius:22px 22px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -18px 50px rgba(20,40,40,.16)}
.move-sheet-panel h3{margin:0 0 12px}
.move-day-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.move-day-btn{border:1px solid var(--border);background:#FFF;color:var(--text);border-radius:12px;padding:12px 6px;font-weight:700}
.move-day-btn.active{background:#E4F4F1;border-color:#79C9C2;color:#1D7A74}
.schedule-tools{display:flex;justify-content:flex-end;margin:4px 0 10px}
.component .component-actions{display:flex;gap:6px;align-items:center;margin-top:8px}


.demo.fallback a{display:block;width:100%;box-sizing:border-box;overflow-wrap:anywhere;word-break:normal;line-height:1.15;margin:0!important;padding:2px 0}
.demo.fallback div{max-width:100%;overflow-wrap:anywhere}
.exercise-head{align-items:flex-start}
.exercise-head .demo{flex:0 0 108px}
.coach-toggle{gap:8px;flex-wrap:wrap;text-align:left}
.coach-toggle span:first-child{flex:1 1 120px}
.coach-toggle span:last-child{flex:0 1 auto;font-size:12px;color:#3B7772}
@media(max-width:420px){
  .exercise-head{gap:12px}
  .exercise-head .demo{flex-basis:104px;width:104px;min-width:104px}
  .demo.fallback{padding:9px 7px}
  .coach-toggle{font-size:13px;padding:11px 12px}
}


.exercise-note{margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.exercise-note label{display:block;font-weight:800;font-size:13px;margin-bottom:7px;color:var(--text)}
.exercise-note label span{font-weight:500;color:var(--muted)}
.exercise-note textarea,.weekly-review textarea{width:100%;box-sizing:border-box;min-height:78px;resize:vertical;border:1px solid var(--border);border-radius:13px;background:#FFFDF9;color:var(--text);font:inherit;font-size:14px;line-height:1.4;padding:11px 12px;outline:none}
.exercise-note textarea:focus,.weekly-review textarea:focus{border-color:#79C9C2;box-shadow:0 0 0 3px rgba(87,170,163,.12)}
.weekly-review textarea{margin-top:12px;min-height:100px}


.component.clickable{cursor:pointer;transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease}
.component.clickable:active{transform:scale(.985);border-color:#79C9C2}
.component-openhint{font-size:11px;color:#2E817B;font-weight:800;margin-top:8px}
.touch-ghost{position:fixed;left:0;top:0;z-index:9999;pointer-events:none;background:#174B49;color:#fff;border-radius:12px;padding:10px 12px;font-weight:800;font-size:13px;box-shadow:0 10px 28px rgba(0,0,0,.18);max-width:220px;transform:translate(-9999px,-9999px)}
.drag-handle{touch-action:none;-webkit-user-select:none;user-select:none}
@media(max-width:640px){
  .drag-handle{font-size:20px;padding:8px 10px;border-radius:10px;background:#F0ECE3}
}

@media(max-width:640px){
 .grid{grid-template-columns:1fr 1fr}.card{padding:14px}.component-grid{grid-template-columns:1fr 1fr}.big{font-size:26px}.formgrid{grid-template-columns:1fr}
}
.metric-click{cursor:pointer;-webkit-tap-highlight-color:transparent}.metric-click:active{transform:scale(.99)}
.week-detail-row{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;padding:10px 0;border-bottom:1px solid #e7e2d8}.week-detail-row:last-child{border-bottom:0}.week-detail-row strong{text-align:right}
</style>
</head>

const COACHING = {"90_90": {"title": "90/90 Hip Switches", "goal": "Hip rotation control for straddles, splits and pole positions.", "how": "Sit tall with both knees bent about 90°. Rotate both thighs together from one side to the other without using momentum.", "focus": "Keep your sit bones heavy and torso as tall as your current mobility allows. Move from the hip joints.", "feel": "Deep hip rotators and inner/outer hip working; a mild stretch is fine.", "tempo": "3 sec to rotate → 1 sec pause → 3 sec back.", "cue": "Rotate the thighs; don't throw the knees.", "avoid": "Forcing the knees down, collapsing through the chest, or sharp/pinching hip pain."}, "adductor_rocks": {"title": "Adductor Rock-Backs", "goal": "Open the inner thighs while keeping pelvic control.", "how": "From hands and knees, extend one leg out to the side with the foot planted. Keep a neutral spine and slowly send your hips backward.", "focus": "Hinge at the hips rather than rounding your low back.", "feel": "A lengthening stretch along the inner thigh of the straight leg.", "tempo": "3 sec back → 1–2 sec pause → 2 sec forward.", "cue": "Long spine, hips back.", "avoid": "Bouncing, twisting the pelvis, or pushing into groin pinching."}, "half_kneel_hf": {"title": "Half-Kneeling Hip-Flexor Stretch", "goal": "Improve hip extension for splits and backbends.", "how": "Kneel with one knee down. Gently tuck your pelvis, squeeze the glute of the kneeling side, then shift forward only enough to create the stretch.", "focus": "Posterior pelvic tilt first; distance forward second.", "feel": "Front of the hip/thigh on the kneeling side, not the low back.", "tempo": "Ease in over 3–5 sec; breathe slowly for the prescribed hold.", "cue": "Belt buckle up, glute on.", "avoid": "Arching the low back to fake more range."}, "straddle_pancake": {"title": "Straddle / Pancake", "goal": "Build usable straddle range for inversions and pole shapes.", "how": "Sit in a comfortable straddle. Rotate the pelvis forward and hinge your torso between the legs while keeping the spine long.", "focus": "Anterior pelvic tilt and hip hinge before trying to get the chest lower.", "feel": "Inner thighs and hamstrings lengthening.", "tempo": "Slow 3–5 sec entry; relaxed breathing during the hold.", "cue": "Lead with the pelvis, not the forehead.", "avoid": "Rounding aggressively or forcing the knees toward the floor."}, "straddle_leg_lifts": {"title": "Seated Straddle Leg Lifts", "goal": "Active straddle strength so you can lift your legs into an inversion rather than relying on passive flexibility.", "how": "Sit tall in a straddle. Brace gently, keep one knee straight and lift that heel off the floor without leaning away. Lower with control.", "focus": "Keep the thigh externally rotated enough that the kneecap stays oriented upward; make the lift small and clean.", "feel": "Hip flexors and upper thigh working hard, with abs stabilizing the pelvis. Hip-flexor effort is expected.", "tempo": "1–2 sec lift → 1 sec hold → 3 sec lower.", "cue": "Lift from the hip; stay tall.", "avoid": "Rocking backward, bending the knee, or using momentum."}, "straddle_compression": {"title": "Straddle Compression Lifts", "goal": "Compression strength for higher, wider and more controlled inversion entries.", "how": "Sit tall in a straddle, place hands on the floor in front, brace, and try to lift both straight legs while keeping the torso controlled.", "focus": "Think ribs toward pelvis while the hip flexors actively lift the thighs.", "feel": "Strong hip-flexor/upper-thigh effort plus deep abdominal bracing.", "tempo": "1 sec lift → 1–2 sec hold → 3 sec lower.", "cue": "Compress first, then lift.", "avoid": "Throwing the torso backward or sacrificing straight knees for height."}, "active_straddle_hold": {"title": "Active Straddle Hold", "goal": "Own your straddle range instead of only stretching into it.", "how": "Create your widest controlled straddle and actively hold the legs there using the hips rather than forcing them farther with your hands.", "focus": "Long legs, active quads and controlled pelvis.", "feel": "Outer/inner hips and thighs working; not joint pain.", "tempo": "Build tension gradually, hold while breathing, release slowly.", "cue": "Make the muscles hold the shape.", "avoid": "Forcing maximal passive range."}, "reverse_grip_row": {"title": "Reverse-Grip Dumbbell Row", "goal": "Build lats/upper back and pulling strength that carries over to pole.", "how": "Hinge at the hips with a long spine. Hold dumbbells with palms forward/underhand. Pull elbows toward your back pockets/lower ribs, then lower fully under control.", "focus": "Keep shoulders away from ears and initiate by drawing the upper arm back rather than curling the weight.", "feel": "Lats beneath the armpits and mid-back; biceps assist.", "tempo": "2 sec pull → 1 sec squeeze → 3 sec lower.", "cue": "Elbows to back pockets.", "avoid": "Shrugging, jerking, overextending the low back, or turning it into a curl."}, "oh_triceps": {"title": "Overhead Triceps Extension", "goal": "Train the long head of the triceps through a lengthened position.", "how": "Hold one dumbbell overhead. Keep upper arms mostly vertical as you bend the elbows and lower the weight behind your head, then extend the elbows.", "focus": "Ribs stacked over pelvis; elbows point mostly forward.", "feel": "Stretch and contraction along the back of the upper arms.", "tempo": "3 sec lower → brief stretch → 2 sec extend.", "cue": "Move at the elbows, not the ribs.", "avoid": "Flared ribs, excessive elbow drift, or shoulder pain."}, "band_lat_pulldown": {"title": "High-Anchored Band Lat Pulldown", "goal": "Vertical pulling strength for pole and shoulder-mount preparation.", "how": "Anchor the band high. Kneel or sit with arms overhead, then drive elbows down toward your ribs/back pockets. Return until the lats are long again.", "focus": "Keep ribs controlled and shoulders away from ears.", "feel": "Lats along the sides of your back, with bic function componentsForDay(name,weekIdx=weekIndex()){
  const all=Object.keys(APP_CONFIG.schedule).flatMap(day=>baseComponentsForDay(day));
  const native=all.filter(c=>scheduledDayForComponent(weekIdx,c.key)===name).map(c=>({
    ...c,_logWeek:weekIdx,
    detail: movedDayFor(weekIdx,c.key) ? `Moved here for Week ${weekIdx+1}` : c.detail
  }));
  // Add workouts carried forward from an earlier week without replacing this week's own workout.
  const inbound=[];
  Object.entries(state.scheduleMoves||{}).forEach(([id,val])=>{
    const m=id.match(/^(\d+)::(.+)$/); if(!m) return;
    const sourceWeek=Number(m[1]), key=m[2]; if(sourceWeek===weekIdx) return;
    const rec=typeof val==="string"?{targetWeek:sourceWeek,targetDay:val}:val;
    if(Number(rec?.targetWeek)!==weekIdx || rec?.targetDay!==name) return;
    const base=all.find(c=>c.key===key); if(!base) return;
    inbound.push({...base,_logWeek:sourceWeek,_carried:true,detail:`Carried forward from Week ${sourceWeek+1}`});
  });
  return [...native,...inbound];
}

function creditActivityToWeeklyGoal(type,name="",dateStr=localISODate()){
  const t=(type+" "+name).toLowerCase();
  let key=null;
  if(t.includes("pole class")){
    state.poleClasses.push({id:Date.now()+"p",date:dateStr,completed:true});
    return "pole_class";
  }
  if(t.includes("pole conditioning")) key="pole_conditioning";
  else if(t.includes("upper") && (t.includes("strength")||t.includes("body"))) key="strength_upper";
  else if(t.includes("lower") && (t.includes("strength")||t.includes("body"))) key="strength_lower";
  else if(t.includes("back") && t.includes("mobility")) key="mobility_back";
  else if(t.includes("split") && t.includes("mobility")) key="mobility_splits";
  else if((t.includes("straddle")||t.includes("active flex")) && t.includes("mobility")) key="mobility_straddle";
  // Generic/bonus activities must never consume a scheduled workout slot.
  // Only named scheduled routines (handled above) are credited to componentLogs.
  else if(t.includes("lagree")) key=null;
  else if(t.includes("mobility")) key=null;
  else if(t.includes("strength")) key=null;
  if(key){
    const w=weekIndex(dateStr);
    state.componentLogs=state.componentLogs||{};
    state.componentLogs[w+"::"+key]={completed:true,completedDate:dateStr};
  }
  return key;
}
function creditWorkoutText(txt,dateStr){

  if(t.includes("upper body")||t.includes("upper strength")) push("strength_upper");
  if(t.includes("lower body")||t.includes("lower strength")) push("strength_lower");
  if(t.includes("pole conditioning")) push("pole_conditioning");
  if(t.includes("back") && t.includes("mobility")) push("mobility_back");
  if(t.includes("split") && t.includes("mobility")) push("mobility_splits");
  if((t.includes("straddle")||t.includes("active flexibility")) && t.includes("mobility")) push("mobility_straddle");
  const lagreeMentions=(t.match(/lagree/g)||[]).length;
  // A Lagree entered through ChatGPT import is an actual/bonus activity on that date,
  // not completion of the next scheduled Lagree card.
  for(let i=0;i<lagreeMentions;i++) state.activities.push({id:Date.now()+"impLagree"+Math.random(),date:dateStr,type:"Lagree",name:"Bonus Lagree",durationMin:0,steps:0,notes:"Imported from ChatGPT",source:"chatgpt"});

function progressionSuggestion(ex){
  const prev=latestExerciseLog(ex.key);
  const preg=!!state.settings.pregnancyMode;
  if(!prev||!prev.sets?.length) return preg ? "Pregnancy mode: use a comfortable, familiar load and leave a few reps in reserve." : "No previous session yet.";
  const upper=parseUpper(ex.reps);
  const complete=prev.sets.every(s=>s.done);
  const same=prev.sets.every(s=>String(s.weight)===String(prev.sets[0].weight));
  const hit=upper&&prev.sets.every(s=>Number(s.reps)>=upper);

  if(preg){
    if(complete&&hit) return "Pregnancy mode: maintain this load if it feels good. Increase only modestly if it feels clearly easy and you are cleared to do so.";
    return "Pregnancy mode: prioritize good form, comfort and a few reps in reserve over beating last time.";
  }

  if(complete&&same&&hit){
    if(ex.key.includes("band")) return "All sets hit the top of the range. Use a slightly heavier band or more tension.";
    return "All sets hit the top of the range. Consider a small weight increase next time.";
  }
  return "Keep the same load and try to add a rep while staying in range.";
}

function weeklyPacing(dates,g,today=localISODate()){
  const currentIndex=Math.max(0,Math.min(6,dates.indexOf(today)>=0?dates.indexOf(today):0));
  const throughYesterday=dates.slice(0,currentIndex);
  const remainingDays=Math.max(1,7-currentIndex);
  const sumField=(list,field)=>list.reduce((sum,d)=>sum+Number(state.daily[d]?.[field]||0),0);
  const loggedCount=(list,field)=>list.filter(d=>Number(state.daily[d]?.[field]||0)>0).length;
  const prior={
    steps:sumField(throughYesterday,'steps'),
    calories:sumField(throughYesterday,'calories'),
    protein:sumField(throughYesterday,'protein')
  };
  const todayVals={
    steps:Number(state.daily[today]?.steps||0),
    calories:Number(state.daily[today]?.calories||0),
    protein:Number(state.daily[today]?.protein||0)
  };
  const targets={steps:Number(g.weeklySteps||0),calories:Number(g.calories||0)*7,protein:Number(g.proteinMin||0)*7};
  const pace={
    steps:Math.max(0,Math.ceil((targets.steps-prior.steps)/remainingDays)),
    calories:Math.max(0,Math.round((targets.calories-prior.calories)/remainingDays)),
    protein:Math.max(0,Math.ceil((targets.protein-prior.protein)/remainingDays))
  };
  const toGo={
    steps:Math.max(0,pace.steps-todayVals.steps),
    calories:Math.max(0,pace.calories-todayVals.calories),
    protein:Math.max(0,pace.protein-todayVals.protein)
  };
  const totalsThroughToday={
    steps:prior.steps+todayVals.steps,
    calories:prior.calories+todayVals.calories,
    protein:prior.protein+todayVals.protein
  };
  const elapsed=Math.max(1,currentIndex+1);
  const avgLogged={
    calories:(()=>{const n=loggedCount(dates.slice(0,currentIndex+1),'calories');return n?Math.round(totalsThroughToday.calories/n):0})(),
    protein:(()=>{const n=loggedCount(dates.slice(0,currentIndex+1),'protein');return n?Math.round(totalsThroughToday.protein/n):0})(),
    steps:Math.round(totalsThroughToday.steps/elapsed)
  };
  return {currentIndex,remainingDays,prior,todayVals,targets,pace,toGo,totalsThroughToday,avgLogged};
}

function openWeeklyDetail(type){
  const dates=weekDates(weekIndex()), today=localISODate();
  const used=dates.filter(d=>d<=today);
  const fmt=d=>new Date(d+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  let title="Week so far", body="";
  if(type==="nutrition"){
    title="Nutrition this week";
    body=`<div class="week-detail-row" style="grid-template-columns:1fr 1fr 1fr 1fr 1fr;align-items:end"><span></span><span class="kicker">Calories</span><span class="kicker">Protein</span><span class="kicker">Fiber</span><span class="kicker">Fluids</span></div>`+used.map(d=>{const x=state.daily[d]||{};return `<div class="week-detail-row" style="grid-template-columns:1fr 1fr 1fr 1fr 1fr"><span>${fmt(d)}</span><strong>${x.calories!==""&&x.calories!=null?Number(x.calories).toLocaleString()+" kcal":"—"}</strong><strong>${x.protein!==""&&x.protein!=null?x.protein+" g":"—"}</strong><strong>${x.fiber!==""&&x.fiber!=null?x.fiber+" g":"—"}</strong><strong>${x.water!==""&&x.water!=null?x.water+" oz":"—"}</strong></div>`}).join("");
  } else if(type==="steps" || type==="sleep"){
    title=type==="steps"?"Steps this week":"Sleep this week";
    body=used.map(d=>{const x=state.daily[d]||{},v=type==="steps"?x.steps:x.sleepHours;return `<div class="week-detail-row" style="grid-template-columns:1fr 1fr"><span>${fmt(d)}</span><strong>${v!==""&&v!=null?(type==="steps"?Number(v).toLocaleString()+" steps":v+" h"):"—"}</strong></div>`}).join("");
  } else {
    title=type.charAt(0).toUpperCase()+type.slice(1)+" this week";
    body=used.map(d=>{
      const completed=completedComponentsOnDate(d);
      let vals=[];
      if(type==="lagree") {
        vals=completed.filter(c=>c.category==="lagree").map(c=>c.label+" ✓");
        bonusActivitiesOnDate(d).filter(a=>(a.type||"").toLowerCase()==="lagree").forEach(a=>vals.push(`${a.name||"Bonus Lagree"} ✓ <button class="move-btn" style="margin-left:6px;padding:5px 9px" onclick="event.stopPropagation();removeBonusActivity('${a.id}')">Remove</button>`));
      }
      if(type==="strength") vals=completed.filter(c=>c.category==="strength").map(c=>c.label+" ✓");
      if(type==="mobility") vals=completed.filter(c=>c.category==="mobility").map(c=>c.label+" ✓");
      if(type==="pole"){
        vals=completed.filter(c=>c.category==="poleConditioning").map(c=>c.label+" ✓");
        if(poleClassesOnDate(d).length) vals.push("Pole class ✓");
      }
      return `<div class="week-detail-row" style="grid-template-columns:1fr 1.6fr"><span>${fmt(d)}</span><strong>${vals.join(" • ")||"—"}</strong></div>`;
    }).join("");
  }
  document.getElementById("weeklyDetailTitle").textContent=title;
  document.getElementById("weeklyDetailBody").innerHTML=body||'<div class="small">Nothing logged yet.</div>';
  document.getElementById("weeklyDetailSheet").classList.add("open");
}
function closeWeeklyDetail(){document.getElementById("weeklyDetailSheet")?.classList.remove("open")}

function exerciseDisplayName(key){
  let found=null;
  Object.values(APP_CONFIG.schedule).forEach(s=>(s.exercises||[]).forEach(e=>{if(e.key===key)found=e.name}));
  Object.values(EXERCISE_VARIATIONS).forEach(list=>(list||[]).forEach(e=>{if(e.key===key)found=e.name}));
  return found||String(key||"").replaceAll("_"," ").replace(/\b\w/g,c=>c.toUpperCase());
}

function copyWeeklyFeedback(w=weekIndex()){
  const dates=new Set(weekDates(w));
  const exerciseName={};
  Object.values(APP_CONFIG.schedule).forEach(s=>(s.exercises||[]).forEach(e=>exerciseName[e.key]=e.name));
  Object.values(EXERCISE_VARIATIONS).forEach(list=>(list||[]).forEach(e=>exerciseName[e.key]=e.name));
  const lines=[`WEEK ${w+1} WORKOUT FEEDBACK`];
  const wn=state.weeklyNotes?.[weeklyReviewKey(w)];
  if(wn) lines.push(`Overall: ${wn}`);
  notesForWeek(w).forEach(n=>lines.push(`${n.date} — ${exerciseName[n.exercise]||n.exercise}: ${n.note}`));
  if(lines.length===1) lines.push("No notes saved yet.");
  const payload=lines.join("\n");
  if(navigator.clipboard?.writeText){navigator.clipboard.writeText(payload).then(()=>toast("Feedback copied for ChatGPT")).catch(()=>window.prompt("Copy this feedback:",payload))}
  else window.prompt("Copy this feedback:",payload);
}

function exerciseNoteKey(exKey,dateStr){return dateStr+"::"+exKey}
function saveExerciseNote(exKey,dateStr,value){
  state.exerciseNotes=state.exerciseNotes||{};
  const k=exerciseNoteKey(exKey,dateStr);
  if(String(value||"").trim()) state.exerciseNotes[k]=String(value).trim();
  else delete state.exerciseNotes[k];
  // Save silently so iPhone keyboard Done/blur does not rerender the app
  // or kick the user back to the workout/main page.
  persistWithoutRerender();
}
function weeklyReviewKey(w){return "week_"+w}
function saveWeeklyNote(w,value){
  state.weeklyNotes=state.weeklyNotes||{};
  const k=weeklyReviewKey(w);
  if(String(value||"").trim()) state.weeklyNotes[k]=String(value).trim();
  else delete state.weeklyNotes[k];
  save();
}
function notesForWeek(w=weekIndex()){
  const dates=new Set(weekDates(w));
  return Object.entries(state.exerciseNotes||{})
    .filter(([k])=>dates.has(k.split("::")[0]))
    .map(([k,v])=>({date:k.split("::")[0],exercise:k.split("::")[1],note:v}));
}

function renderExercise(ex,d,baseKey=ex.key,w=weekIndex(),componentKey="strength_upper"){
  const k=d+"::"+ex.key;
  const style=trackingStyle(ex);
  const log=state.exerciseLogs[k]||{sets:Array.from({length:ex.sets},()=>({weight:"",reps:"",done:false})),rpe:""};
  state.exerciseLogs[k]=log;

  const rows=Array.from({length:ex.sets},(_,i)=>{
    const s=log.sets[i]||{};
    if(style==="strength"){
      return `<div>${i+1}</div>
        <input inputmode="decimal" placeholder="${state.settings.weightUnit}" value="${s.weight??""}" onchange="setEx('${k}',${i},'weight',this.value)">
        <input inputmode="numeric" placeholder="reps" value="${s.reps??""}" onchange="setEx('${k}',${i},'reps',this.value)">
        <input class="check" type="checkbox" ${s.done?"checked":""} onchange="setEx('${k}',${i},'done',this.checked);autoRest('${ex.key}')">`;
    }

function saveSleep(){
  const d=localISODate(), x=state.daily[d]||(state.daily[d]={});
  const start=document.getElementById("sleepStart").value,end=document.getElementById("sleepEnd").value,awake=Number(document.getElementById("awakeMin").value||0);

  if(start&&end){
    const [sh,sm]=start.split(":").map(Number),[eh,em]=end.split(":").map(Number);
    let startMinutes=sh*60+sm;
    let mins=(eh*60+em)-startMinutes; if(mins<=0) mins+=1440; mins=Math.max(0,mins-awake);
    if(mins>14*60 && sh===12){ startMinutes=sm; mins=(eh*60+em)-startMinutes; if(mins<=0) mins+=1440; mins=Math.max(0,mins-awake); }
    x.sleepHours=Math.round(mins/6)/10;
  }
  save();toast("Sleep saved");

function applyAppUpdate(){
  const raw=(document.getElementById("updateText")?.value||"").trim(); if(!raw)return;
  const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const val=k=>{const m=lines.find(x=>x.toUpperCase().startsWith(k+":"));return m?m.slice(m.indexOf(":")+1).trim():null};
  const num=k=>{const v=val(k);if(v==null)return null;const m=v.replace(/,/g,"").match(/-?\d+(?:\.\d+)?/);return m?Number(m[0]):null};
  const g=state.settings.goals;
  const goalMap={WEEKLY_STEPS:"weeklySteps",CALORIES:"calories",PROTEIN_MIN:"proteinMin",PROTEIN_MAX:"proteinMax",FIBER_MIN:"fiberMin",FIBER_MAX:"fiberMax",FLUIDS_MIN:"waterMin",FLUIDS_MAX:"waterMax",SLEEP_HOURS:"sleepHours"};
  Object.entries(goalMap).forEach(([k,p])=>{const n=num(k);if(n!=null)g[p]=n});
  const unit=val("WEIGHT_UNIT"); if(unit && /^(lb|kg)$/i.test(unit))state.settings.weightUnit=unit.toLowerCase();

  // Workout update format:
  // UPDATE_WORKOUT: Upper Body
  // ADD: Exercise Name | 3 sets | 10-15 reps
  // REMOVE: Exercise Name
  // EDIT: Exercise Name | 3 sets | 12-15 reps
  const workout=val("UPDATE_WORKOUT");
  if(workout){
    const ck=updateComponentKey(workout), w=weekIndex();
    if(!ck){alert("Workout name not recognized. Use Upper Body or Lower Body.");return}
    let keys=planKeysForComponent(ck,w);
    lines.forEach(line=>{
      const c=line.indexOf(":"); if(c<0)return;
      const cmd=line.slice(0,c).trim().toUpperCase(), body=line.slice(c+1).trim();
      if(cmd==="ADD"){
        const parts=body.split("|").map(x=>x.trim()), name=parts[0];
        const sets=Number((parts.find(x=>/set/i.test(x))||"3").match(/\d+/)?.[0]||3);
        const reps=(parts.find(x=>/rep/i.test(x))||"8–12").replace(/\s*reps?\s*/i,"").trim();
        const key="custom_"+Date.now()+"_"+Math.random().toString(36).slice(2,6);
        state.customExercises[key]={key,name,sets,reps,restSec:90,strength:true,why:"Added by pasted app update."}; keys.push(key);
      }else if(cmd==="REMOVE"){
        const k=findPlanExerciseKey(ck,body,w); if(k)keys=keys.filter(x=>x!==k);
      }else if(cmd==="EDIT"){
        const parts=body.split("|").map(x=>x.trim()), name=parts[0], baseKey=findPlanExerciseKey(ck,name,w);
        if(baseKey){
          const ex=currentExerciseFor(baseKey,w)||exerciseByKey(baseKey);
          const sets=Number((parts.find(x=>/set/i.test(x))||String(ex.sets||3)).match(/\d+/)?.[0]||ex.sets||3);
          const reps=(parts.find(x=>/rep/i.test(x))||String(ex.reps||"8–12")).replace(/\s*reps?\s*/i,"").trim();
          const key="custom_"+Date.now()+"_"+Math.random().toString(36).slice(2,6);
          state.customExercises[key]={...ex,key,name:ex.name,sets,reps,why:"Edited by pasted app update."};
          state.exerciseSwaps.ongoing[baseKey]=key;
        }
      }
    });
    state.componentPlans.ongoing[ck]=keys;
  }
  save(); toast("App update applied");
  const box=document.getElementById("updateText"); if(box)box.value="";
}

function importChatGPT(){
  const raw=document.getElementById("importText").value.trim(); if(!raw)return;
  const parseNum=v=>{if(v==null)return undefined;const m=String(v).replace(/,/g,"").match(/-?\d+(?:\.\d+)?/);return m?Number(m[0]):undefined};
  const importOne=(chunk,obj=null)=>{
    let o=obj||{};
    if(!obj){
      const get=k=>chunk.match(new RegExp("^\\s*(?:[-*•]\\s*)?(?:\\*\\*)?"+k+"(?:\\*\\*)?\\s*:\s*(.+)$","im"))?.[1]?.trim();
      o.date=(get("DATE")||localISODate()).replace(/[`*_]/g,"").trim();
      o.steps=parseNum(get("STEPS"));o.calories=parseNum(get("CALORIES"));o.protein=parseNum(get("PROTEIN"));o.fiber=parseNum(get("FIBER"));o.water=parseNum(get("WATER")||get("FLUIDS"));o.sleep=parseNum(get("SLEEP"));
      o.notes=get("NOTES")||get("NUTRITION")||get("FOOD/NUTRITION NOTE")||get("NUTRITION NOTE")||"";
      o.workout=(chunk.match(/WORKOUT:\s*([\s\S]*?)(?:\n\s*(?:[-*•]\s*)?(?:\*\*)?[A-Z][A-Z /&_-]*(?:\*\*)?\s*:|$)/i)?.[1]||"").trim();
    }
    ["steps","calories","protein","fiber","water","sleep"].forEach(k=>{if(o[k]!=null)o[k]=parseNum(o[k])});
    const hash=btoa(unescape(encodeURIComponent(chunk))).slice(0,64), already=state.imports.some(x=>x.hash===hash);
    const d=o.date||localISODate(),x=state.daily[d]||(state.daily[d]={});
    ["steps","calories","protein","fiber","water"].forEach(k=>{if(o[k]!=null)x[k]=o[k]}); if(o.sleep!=null)x.sleepHours=o.sleep;if(o.notes)x.notes=o.notes;
    if(o.steps!=null)x.stepsUpdatedAt=new Date().toISOString();
    if(!already)state.imports.push({hash,date:d,createdAt:new Date().toISOString()}); if(o.workout&&!already)creditWorkoutText(o.workout,d);
    return d;
  };
  try{const parsed=JSON.parse(raw);if(Array.isArray(parsed))parsed.forEach(o=>importOne(JSON.stringify(o),o));else importOne(raw,parsed)}catch{
    const starts=[...raw.matchAll(/^\s*DATE\s*:/gim)].map(m=>m.index);
    if(starts.length>1){starts.forEach((st,i)=>importOne(raw.slice(st,starts[i+1]??raw.length).trim()))}else importOne(raw);
  }
  persistWithoutRerender();renderLog();renderHome();renderProgress();toast("ChatGPT log imported");
}

   <div class="row" style="margin-top:10px"><div class="small">${notesForWeek(w).length} exercise note${notesForWeek(w).length===1?"":"s"} automatically included.</div><button class="move-btn" onclick="copyWeeklyFeedback(${w})">Copy for ChatGPT</button></div></div>
   <div class="card exercise"><div class="kicker">Workout history</div><h2>Recent strength logs</h2>
   ${Object.entries(state.exerciseLogs).filter(([k,v])=>{const key=k.split("::")[1],ex=exerciseByKey(key);return (STRENGTH_KEYS.has(key)||ex?.strength)&&(v?.sets||[]).some(s=>s.weight||s.reps||s.done)}).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,12).map(([k,v])=>{const key=k.split("::")[1],ex=exerciseByKey(key);return `<div class="milestone"><div>${ex?.name||key.replaceAll("_"," ")}</div><div class="small">${k.slice(0,10)} • ${v.sets.map(s=>`${s.weight||"—"}×${s.reps||"—"}`).join(" / ")}${v.rpe?` • ${v.rpe}`:""}</div></div>`}).join("")||'<div class="sub">No completed strength sets logged yet.</div>'}
   </div>`;
}
function renderMore(){
  const g=state.settings.goals;
  document.getElementById("more").innerHTML=`
   <div class="card"><div class="kicker">Settings</div><h2>Mode & goals</h2>
   <div class="card" style="margin-top:12px;background:#FFFDF9;box-shadow:none">
     <div class="row">
       <div><h3>Pregnancy Mode</h3><div class="small">Switches the app from recomp progression to maintenance, recovery and comfort-first guidance.</div></div>
       <label style="display:flex;align-items:center;gap:8px;color:var(--text)"><input class="check" id="pregnancyMode" type="checkbox" ${state.settings.pregnancyMode?"checked":""}> On</label>
     </div>
   </div>
   <div class="formgrid" style="margin-top:10px">
    <label>Weekly steps<input id="goalSteps" type="number" value="${g.weeklySteps}"></label>
    <label>Calories<input id="goalCalories" type="number" value="${g.calories}"></label>
    <label>Protein min (g)<input id="goalProteinMin" type="number" value="${g.proteinMin}"></label>
    <label>Protein max (g)<input id="goalProteinMax" type="number" value="${g.proteinMax}"></label>
    <label>Fiber min (g)<input id="goalFiberMin" type="number" value="${g.fiberMin}"></label>
    <label>Fiber max (g)<input id="goalFiberMax" type="number" value="${g.fiberMax}"></label>
    <label>Fluids min (oz)<input id="goalWaterMin" type="number" value="${g.waterMin||70}"></label>
    <label>Fluids max (oz)<input id="goalWaterMax" type="number" value="${g.waterMax||80}"></label>
    <label>Sleep hours<input id="goalSleep" type="number" step=".1" value="${g.sleepHours}"></label>
    <label>Program start<input id="startDate" type="date" value="${state.programStartDate}"></label>
    <label>Weight unit<select id="weightUnit"><option ${state.settings.weightUnit==="lb"?"selected":""}>lb</option><option ${state.settings.weightUnit==="kg"?"selected":""}>kg</option></select></label>
   </div><button class="btn" style="margin-top:12px" onclick="saveSettings()">Save settings</button>
   <div class="small" style="margin-top:10px">You can change these anytime. To customize a strength workout, open it from Workouts and use Edit, ↑/↓, Remove, or Add exercise. You can also drag workouts to another day.</div></div>
   <div class="card exercise"><div class="kicker">Backup</div><h2>Your data</h2><div class="row" style="margin-top:12px;flex-wrap:wrap">
    <button class="btn secondary" onclick="exportData()">Export JSON</button>
    <label class="btn secondary" style="cursor:pointer;color:var(--text)">Restore JSON<input type="file" accept="application/json" style="display:none" onchange="restoreData(this.files[0])"></label>
    <button class="btn danger" onclick="resetData()">Reset data</button>
   </div><div class="small" style="margin-top:10px"><strong>Export JSON backs up everything:</strong> daily nutrition (including fiber and fluids), steps, sleep, weight, workout completion dates, bonus activities, pole classes, exercise sets/reps/weights, exercise notes, schedule moves, imports, settings and milestones. Keep a backup before replacing the app file.</div></div>
   <div class="card exercise"><div class="kicker">About</div><p class="sub">Exercise demos load only for exact verified database matches. When no exact in-app image exists, the app provides exact-name video/photo search links rather than substituting a different movement. Each programmed movement also includes technique coaching for setup, focus, expected sensation, tempo, common mistakes, and a mind-to-muscle cue. Custom pole and mobility moves intentionally show a clean fallback instead of a misleading demo.</p><hr><p class="sub">Pregnancy Mode is a planning aid, not medical clearance. Your prenatal clinician's advice takes priority, especially after a recent ectopic/PUL, bleeding, pain or other complications.</p></div>`;
}
function saveSettings(){
  state.settings.pregnancyMode=!!document.getElementById("pregnancyMode").checked;
  state.settings.goals.weeklySteps=Number(document.getElementById("goalSteps").value);
  state.settings.goals.waterMin=Number(document.getElementById("goalWaterMin").value); state.settings.goals.waterMax=Number(document.getElementById("goalWaterMax").value);
  state.settings.goals.calories=Number(document.getElementById("goalCalories").value);
  state.settings.goals.proteinMin=Number(document.getElementById("goalProteinMin").value);
  state.settings.goals.proteinMax=Number(document.getElementById("goalProteinMax").value);
  state.settings.goals.fiberMin=Number(document.getElementById("goalFiberMin").value);
  state.settings.goals.fiberMax=Number(document.getElementById("goalFiberMax").value);
  state.settings.goals.sleepHours=Number(document.getElementById("goalSleep").value);
  state.programStartDate=document.getElementById("startDate").value;
  state.settings.weightUnit=document.getElementById("weightUnit").value;save();toast("Settings saved");
}
function exportData(){
  const backup={...state,_backup:{exportedAt:new Date().toISOString(),storageKey:STORAGE_KEY,includes:"full app state"}};
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=`6-week-recomp-backup-${localISODate()}.json`;a.click();URL.revokeObjectURL(a.href);toast("Full backup exported")
}
function restoreData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();toast("Backup restored")}catch{alert("Invalid JSON backup")}};r.readAsText(file)}
function resetData(){if(confirm("Reset all local app data? This cannot be undone unless you exported a backup.")){state=emptyState();save();toast("Data reset")}}

function switchPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.toggle("active",p.id===id));
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===id));
  const map={home:["Dashboard","Stronger, freer, more consistent."],workouts:["Workouts","Your weekly plan."],log:["Daily Log","Nutrition, movement, sleep and imports."],progressPage:["Progress","Trends, milestones and history."],more:["More","Settings and backup."]};
  document.getElementById("pageTitle").textContent=map[id][0];document.getElementById("pageSub").textContent=map[id][1];
  renderAll(false);
}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>switchPage(b.dataset.page));
document.getElementById("quickAdd").onclick=()=>switchPage("log");

function startWorkoutTimer(label){
  if(activeTimer)clearInterval(activeTimer.interval);
  activeTimer={type:"up",label,start:Date.now(),elapsed:0,paused:false};
  tickTimer();activeTimer.interval=setInterval(tickTimer,1000);
}
function startCountdown(sec,label){
  if(activeTimer)clearInterval(activeTimer.interval);
  activeTimer={type:"down",label,remaining:sec,paused:false};
  tickTimer();activeTimer.interval=setInterval(tickTimer,1000);
}
function autoRest(){startCountdown(90,"Rest")}
function tickTimer(){
  const bar=document.getElementById("timerBar");bar.classList.add("show");document.getElementById("timerLabel").textContent=activeTimer.label;
  let sec;if(activeTimer.type==="up"){if(!activeTimer.paused)activeTimer.elapsed=Math.floor((Date.now()-activeTimer.start)/1000);sec=activeTimer.elapsed}
  else {sec=activeTimer.remaining;if(!activeTimer.paused){activeTimer.remaining--; if(activeTimer.remaining<0){clearInterval(activeTimer.interval);toast("Timer complete");stopTimer();return}}}
  document.getElementById("timerDisplay").textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
}
function stopTimer(){if(activeTimer?.interval)clearInterval(activeTimer.interval);activeTimer=null;document.getElementById("timerBar").classList.remove("show")}
document.getElementById("timerStop").onclick=stopTimer;
document.getElementById("timerPause").onclick=()=>{if(!activeTimer)return;activeTimer.paused=!activeTimer.paused;if(activeTimer.type==="up"&&!activeTimer.paused)activeTimer.start=Date.now()-activeTimer.elapsed*1000;document.getElementById("timerPause").textContent=activeTimer.paused?"Resume":"Pause"};

function renderAll(keepPage=true){
  renderHome(); renderWorkouts(); renderLog(); renderProgress(); renderMore();
}
// Compatibility migration: remove retired finisher exercises from active plans while keeping historical logs.
state.componentPlans=state.componentPlans||{week:{},ongoing:{}};for(const bucket of [state.componentPlans.week||{},state.componentPlans.ongoing||{}]){for(const k of Object.keys(bucket)){if(k.includes("strength_upper"))bucket[k]=(bucket[k]||[]).filter(x=>!String(x).startsWith("bridal_"));}}
for(const x of Object.values(state.daily||{})){if(x.postMealMovement==null)x.postMealMovement=!!(x.postMealBreakfast||x.postMealLunch||x.postMealDinner);}
// Compatibility: older versions stored workout completion in sessionLogs. Carry those completions into the current component system.
(function migrateLegacyWorkoutCompletions(){
  state.componentLogs=state.componentLogs||{};
  const map={tue_upper:["strength_upper"],wed_pole_cond:["pole_conditioning"],thu_lower:["strength_lower","mobility_splits"],fri_lagree:["lagree_2"],sat_lagree:["lagree_3","mobility_back"]};
  for(const [legacyKey,rec] of Object.entries(state.sessionLogs||{})){
    if(!rec?.completed) continue;
    const parts=legacyKey.split("::"), date=parts[0], sessionKey=parts.slice(1).join("::");
    for(const componentKey of (map[sessionKey]||[])){
      const wk=weekIndex(date), k=wk+"::"+componentKey;
      if(!state.componentLogs[k]?.completed) state.componentLogs[k]={completed:true,completedDate:date,migratedFrom:sessionKey};
    }
  }
})();
persistWithoutRerender();
(async()=>{renderAll(); await loadExerciseDB(); renderAll()})();
</script>
